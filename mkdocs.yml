site_name: Pasaporte al Español
site_description: Programa extraescolar de español · material de la profesora
site_url: https://jgcela.github.io/spanish-classes/
repo_url: https://github.com/jgcela/spanish-classes
repo_name: jgcela/spanish-classes
edit_uri: edit/main/docs/
copyright: Material interno de la profesora

# Paquete para subir a otra web: OFFLINE=true mkdocs build
# (páginas .html y buscador que funciona incluso abriendo los archivos sin servidor)
use_directory_urls: !ENV [DIRECTORY_URLS, true]

theme:
  name: material
  custom_dir: overrides
  language: es
  font:
    text: Atkinson Hyperlegible
    code: JetBrains Mono
  icon:
    logo: material/passport
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit

extra_css:
  - assets/estilos.css

extra_javascript:
  - assets/planificador.js

hooks:
  - hooks/listas.py
  - hooks/enlaces.py
  - hooks/planificador.py

plugins:
  - search:
      lang: es
  - offline:
      enabled: !ENV [OFFLINE, false]

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      permalink_title: Enlace a esta sección
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

