name: Publicar web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Construir la web
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict

      - name: Generar los PDF
        run: python scripts/generar_pdfs.py site

      - name: Paquete HTML para subir a otra web
        env:
          NO_MKDOCS_2_WARNING: "1"
          OFFLINE: "true"
        run: |
          mkdocs build --strict -d paquete/pasaporte-al-espanol
          python scripts/generar_pdfs.py paquete/pasaporte-al-espanol

      - uses: actions/upload-artifact@v4
        with:
          name: pasaporte-al-espanol-html
          path: paquete/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    if: github.event_name != 'pull_request'
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4

  # Job aparte: si falla el FTP, la web de GitHub Pages se publica igual.
  subir-ftp:
    if: github.event_name != 'pull_request'
    needs: construir
    runs-on: ubuntu-latest
    env:
      HAY_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pasaporte-al-espanol-html
          path: paquete/

      # Sube el paquete a tu propia web por FTP. Solo en main y si existen los
      # secretos FTP_SERVER, FTP_USERNAME y FTP_PASSWORD (opcionales FTP_DIR,
      # carpeta de destino, por defecto /public_html/javiercela-me/spanish/,
      # y FTP_PORT, por defecto 22). El servidor solo admite SFTP.
      - name: Carpeta de destino FTP
        id: carpeta
        if: env.HAY_FTP == 'true'
        env:
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          dir="${FTP_DIR:-/public_html/javiercela-me/spanish/}"
          dir="$(echo "$dir" | xargs)"
          case "$dir" in */) ;; *) dir="$dir/" ;; esac
          # Por SFTP, "/public_html/..." apunta a la raíz del servidor, no a la
          # cuenta del usuario: se usa la ruta relativa a la carpeta de inicio.
          dir="${dir#/}"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Subir a mi web por SFTP
        if: env.HAY_FTP == 'true'
        env:
          SERVIDOR: ${{ secrets.FTP_SERVER }}
          USUARIO: ${{ secrets.FTP_USERNAME }}
          CLAVE: ${{ secrets.FTP_PASSWORD }}
          PUERTO: ${{ secrets.FTP_PORT }}
          DESTINO: ${{ steps.carpeta.outputs.dir }}
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq lftp > /dev/null
          # Permisos estándar de hosting: carpetas 755 y archivos 644.
          # Con otros permisos (p. ej. 775/664) muchos servidores responden 403 Forbidden.
          find paquete/pasaporte-al-espanol -type d -exec chmod 755 {} +
          find paquete/pasaporte-al-espanol -type f -exec chmod 644 {} +
          servidor="$(echo "$SERVIDOR" | xargs | sed -E 's#^(s?ftp|sftp)://##; s#/.*$##')"
          lftp -p "${PUERTO:-22}" -u "$USUARIO","$CLAVE" "sftp://$servidor" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 30;
            mkdir -p -f '$DESTINO';
            mirror --reverse --parallel=5 --verbose=1 paquete/pasaporte-al-espanol/ '$DESTINO';
            chmod 755 '$DESTINO';
            pwd;
            cls -l '$DESTINO';
            quit"
